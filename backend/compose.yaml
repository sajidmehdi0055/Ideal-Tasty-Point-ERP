name: ideal-tasty-point-s01-dev
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: erp_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local-only PostgreSQL administrator password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_local"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
